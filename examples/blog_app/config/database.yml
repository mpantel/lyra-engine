# PostgreSQL from the repository's docker-compose.yml (container lyra_postgres,
# localhost:5433). Start it from the repository root with:
#   docker compose up -d db
# DATABASE_HOST, DATABASE_PORT, DATABASE_USER and DATABASE_PASSWORD override
# the defaults for another server.

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5433 } %>
  username: <%= ENV.fetch("DATABASE_USER") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: blog_app_development

test:
  <<: *default
  database: <%= ENV.fetch("BLOG_APP_TEST_DATABASE") { "blog_app_test" } %>
