name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 4.0 is the gemspecs' floor (.ruby-version: 4.0.7)
        ruby-version: ['4.0']

    # The dummy app's test database (test/dummy/config/database.yml)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyra_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    # Lyra, then PAM DSL and PetriFlow (the gems run from the root bundle)
    - name: Run tests
      run: bundle exec rake test:all

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-ruby-${{ matrix.ruby-version }}
        path: |
          test/reports/*.xml
          gems/*/test/reports/*.xml
